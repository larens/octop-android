name: Build Native APK

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT" 2>&1 || true

          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            # compileSdk 是 36，runner 预装的 SDK 通常只到 35，缺哪个补哪个
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "未找到 sdkmanager，依赖 runner 预装的 SDK"
          fi
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Assemble APK
        env:
          # 未配置仓库 Secrets 时，build.gradle.kts 会自动回退到 debug 签名
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          fi
          ./gradlew :app:assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/octop-native.apk \;
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: octop-native-apk
          path: out/octop-native.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/octop-native.apk
          generate_release_notes: true
